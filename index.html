<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p class="subtitle">Capture and manage your notes</p>
  </header>

  <main>
    <section class="controls">
      <button id="load-btn" type="button">Load notes</button>
    </section>

    <p id="status" role="status" aria-live="polite"></p>

    <section class="create-note">
      <h2>Add a note</h2>
      <form id="note-form" novalidate>
        <div class="field">
          <label for="title-input">Title (required, max 100 characters)</label>
          <input id="title-input" name="title" type="text" maxlength="100" required>
        </div>
        <div class="field">
          <label for="body-input">Body (optional)</label>
          <textarea id="body-input" name="body" rows="3"></textarea>
        </div>
        <button id="submit-btn" type="submit">Create note</button>
      </form>
    </section>

    <section class="notes">
      <h2>Notes</h2>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>QuickNotes demo &mdash; using JSONPlaceholder practice API</p>
  </footer>
</body>
</html>
